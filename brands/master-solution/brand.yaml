# Afirmaciones que ningún texto de gráficos, títulos o subtítulos editoriales puede hacer.
# El linter las trata como ERROR (regla BRAND).
forbidden_claims:
  - reemplaza empleados
  - reemplaza a tus empleados
  - reemplaza al personal
  - sustituye al equipo
  - dinero fácil
  - dinero rápido
  - ganar dinero sin esfuerzo
  - negocio que funciona solo
  - negocio en piloto automático
