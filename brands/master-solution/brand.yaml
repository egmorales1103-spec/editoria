voice_notes: >-
  Cercana, clara y profesional, con voseo costarricense natural. La tecnología facilita la vida
  del equipo: se habla de ahorrar tiempo en tareas repetitivas, no de reducir personal. Público:
  dueños, gerentes y responsables de empresas de unos 20 colaboradores o más. Sin promesas de
  dinero fácil ni de un negocio que funciona solo. Las cifras son reales o están marcadas como
  ejemplo. Sin tecnicismos innecesarios: si aparece un término de IA, se explica en una frase.
