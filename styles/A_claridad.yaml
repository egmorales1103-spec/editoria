# Estilo A — Claridad profesional.
# Pensado para contenido de negocio explicado a cámara: el texto acompaña, no compite.
# Referencias en references/patrones.yaml (R03, R07) y references/web.yaml (W01, W09, W10).
id: A
name: Claridad profesional
description: >-
  Subtítulos limpios en una o dos líneas, con una sola palabra de énfasis en el color de acento
  (patrón R03, sin mayúsculas forzadas). Acercamientos discretos y poco frecuentes sobre los píxeles
  existentes (idea de R07, solo reencuadre). Un único gráfico a la vez, sobrio: palabra clave,
  checklist, comparación o dato con su origen. Sonido mínimo: pop o click en la entrada de un
  gráfico, whoosh solo en un reencuadre marcado.
references: [R03, R07, W01, W09, W10]
captions:
  font: Inter
  weight: 700
  size: 64
  case: as_is
  words_per_event: 4
  max_chars_line: 24
  max_lines: 2
  max_cps: 17
  highlight: accent
  outline: 3
  shadow: 1
  animation: fade
  position_y: 0.68
editorial_titles:
  font: Inter
  weight: 800
  size: 56
  case: upper
  words_per_event: 6
  max_chars_line: 22
  max_lines: 2
  max_cps: 20
  highlight: accent
  outline: 0
  shadow: 0
  animation: fade
  position_y: 0.2
graphics:
  allowed_templates: [titulo_gancho, palabra_clave, checklist, dato_grafico, comparacion, cta_cierre]
  max_simultaneous: 1
sfx:
  max_per_10s: 2
  min_spacing_s: 2.0
  allowed_cues: [pop, click, whoosh, ding]
reframe:
  cadence_s: 7.0
  max_zoom: 1.12
