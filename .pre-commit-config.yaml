repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^(uv\.lock|schemas/json/.*|assets/sfx/manifest\.yaml)$
  - repo: local
    hooks:
      # Bloquea medios (mp4, mov, gif, jpg, png...) fuera de las rutas permitidas.
      - id: no-media
        name: no-media (sin medios de terceros en el repositorio)
        entry: python .github/hooks/no_media.py
        language: python
        types: [file]
