<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ meta.id }}</title>
<style>
{{ font_css }}
{{ brand_css }}
:root {
  --w: {{ w }}px;
  --h: {{ h }}px;
  --bleed: {{ bleed }}px;
  /* Text scale (1 = design size). editoriaFitTo() lowers it until the content fits the box. */
  --k: 1;
  --dur: {{ duration }}s;
  --t-in: .55s;
  --t-out: .42s;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-back: cubic-bezier(.34, 1.45, .64, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
  --surface: color-mix(in srgb, var(--color-bg) 86%, transparent);
  --surface-strong: color-mix(in srgb, var(--color-bg) 94%, transparent);
  --hairline: color-mix(in srgb, var(--color-text) 12%, transparent);
  --muted: color-mix(in srgb, var(--color-text) 62%, transparent);
  --accent-soft: color-mix(in srgb, var(--color-accent) 18%, transparent);
  /* Reaches 36px sideways, 50px down, 22px up: it must fit inside --bleed (56px). */
  --shadow: 0 14px 36px rgba(0, 0, 0, .34), 0 2px 8px rgba(0, 0, 0, .22);
  --radius: 34px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: var(--w);
  height: var(--h);
  overflow: hidden;
  background: transparent;
}
body {
  font-family: var(--font-body);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  font-kerning: normal;
}
h1, h2, h3, p { margin: 0; }
.heading { font-family: var(--font-heading); font-weight: 800; letter-spacing: -.02em; }
/* Whole graphic: smooth exit during the last --t-out of the item. */
.stage {
  position: absolute;
  inset: var(--bleed);  /* the visible content box; the bleed around it stays transparent */
  animation: editoria-exit var(--t-out) var(--ease-in) calc(var(--dur) - var(--t-out)) both;
}
@keyframes editoria-exit {
  from { opacity: 1; transform: none; }
  to { opacity: 0; transform: translateY(-14px) scale(.985); }
}
.card {
  background: var(--surface);
  border: 1.5px solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
/* Mandatory provenance labels ("Ejemplo", "Ilustración"): always readable. */
.tag-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 13px;
  border-radius: 999px;
  background: var(--color-text);
  color: var(--color-bg);
  font: 700 22px/1 var(--font-body);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.tag-label::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--color-accent);
  box-shadow: 0 0 0 2px var(--color-bg);
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(26px); }
  to { opacity: 1; transform: none; }
}
@keyframes pop-in {
  0% { opacity: 0; transform: scale(.82); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="stage">
{% block body %}{% endblock %}
</div>
<script type="application/json" id="editoria-params">{{ params|tojson }}</script>
<script>
/* Fit to box. A template that can receive long text defines
     window.editoriaFit = () => window.editoriaFitTo({target: '.panel'});
   and scales its type/spacing with calc(<px> * var(--k)). The renderer calls editoriaFit() once,
   after the fonts are ready and before the first frame, so the result depends only on layout.
   Options: target (selector of an auto-height element), padY (px kept free inside the box),
   check (extra predicate, true when it fits), min (smallest scale, default .55). */
window.editoriaFitTo = function (opts) {
  const root = document.documentElement;
  const stage = document.querySelector('.stage');
  const target = document.querySelector(opts.target);
  const availH = stage.clientHeight - (opts.padY || 0);
  const kMin = opts.min || 0.55;
  const fits = () => target.offsetHeight <= availH + 0.5
    && target.scrollWidth <= target.clientWidth + 0.5
    && (!opts.check || opts.check());
  let k = 1;
  let ok = false;
  for (; k >= kMin - 1e-9; k -= 0.025) {
    root.style.setProperty('--k', k.toFixed(3));
    if (fits()) { ok = true; break; }
  }
  if (!ok) { k = kMin; root.style.setProperty('--k', kMin.toFixed(3)); }
  window.__editoriaFitResult = {k: Number(k.toFixed(3)), fits: ok};
  return window.__editoriaFitResult;
};
</script>
{% block script %}{% endblock %}
</body>
</html>
