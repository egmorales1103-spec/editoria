version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OpenCV 5 dropped CascadeClassifier (Haar face detection used by `analyze`).
      - dependency-name: opencv-python-headless
        versions: [">=5"]
